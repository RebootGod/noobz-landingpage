<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noobz Streaming</title>
    <meta name="description" content="Nonton Film dan Series Bahasa Indonesia">
    <meta property="og:title" content="Noobz Streaming">
    <meta property="og:description" content="Nonton Film dan Series Bahasa Indonesia">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/public/logo.png">
    <link rel="icon" href="/public/logo.png">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 40px 20px;
        background:
          linear-gradient(180deg, rgb(39 39 42 / 0.46), rgb(9 9 11 / 0.92)),
          radial-gradient(circle at 50% 24%, rgb(251 191 36 / 0.18), transparent 20rem),
          linear-gradient(135deg, #111827 0%, #09090b 52%, #18181b 100%);
        color: #fafafa;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 680px);
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
        border-radius: 18px;
        box-shadow: 0 24px 70px rgb(0 0 0 / 0.38);
      }

      .eyebrow {
        margin: 32px 0 12px;
        color: #fcd34d;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 8vw, 72px);
        line-height: 1;
      }

      p {
        margin: 22px auto 0;
        max-width: 560px;
        color: #d4d4d8;
        font-size: clamp(18px, 3vw, 22px);
        line-height: 1.7;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 40px;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        padding: 0 24px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }

      a:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: #fbbf24;
        color: #18181b;
      }

      .primary:hover {
        background: #fcd34d;
      }

      .secondary {
        border: 1px solid rgb(255 255 255 / 0.16);
        background: rgb(255 255 255 / 0.08);
        color: #ffffff;
      }

      .secondary:hover {
        border-color: rgb(255 255 255 / 0.28);
        background: rgb(255 255 255 / 0.12);
      }

      @media (max-width: 520px) {
        .buttons {
          flex-direction: column;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/public/logo.png" alt="Noobz Streaming">
      <div class="eyebrow">Noobz Space</div>
      <h1>Noobz Streaming</h1>
      <p>Nonton Film dan Series Bahasa Indonesia</p>
      <div class="buttons">
        <a class="primary" href="https://stream.noobz.space">Buka Streaming</a>
        <a class="secondary" href="https://t.me/noobzchannel">Telegram</a>
      </div>
    </main>
  </body>
</html>
